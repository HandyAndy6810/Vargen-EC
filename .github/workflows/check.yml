name: Check

# Every push and every pull request. The point is that a compile error is found
# here in about two minutes, rather than twenty minutes into an EAS build or —
# worse — not at all, on a phone in front of a customer.
on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server and shared types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # Installing a package on Replit writes ITS proxy into the lockfile —
      # package-firewall.replit.internal, a host that exists only inside Replit. Any
      # install anywhere else then fails to resolve it, including the EAS build
      # servers, so this would surface as a broken build twenty minutes in rather
      # than here. Caught in seconds instead, with the fix in the message.
      - name: No Replit-internal URLs in lockfiles
        run: |
          if grep -rn "replit.internal" package-lock.json mobile/package-lock.json 2>/dev/null; then
            echo "::error::A lockfile points at Replit's internal npm proxy, which only resolves inside Replit."
            echo "Rewrite those 'resolved' URLs to https://registry.npmjs.org/... — the integrity hashes stay as they are."
            exit 1
          fi
      - run: npm ci
      # Root tsconfig covers server/ and shared/, which the mobile app also imports.
      - run: npm run check
      # The money maths. Pure functions, so these run in about a second and need
      # no device, no database and no network.
      - run: npm test
      # Which database each push reaches (server/lib/database-url.ts). Dummy URLs
      # on a closed port, so nothing real is touched. `db:push` (what a person
      # types, and what the Run button and post-merge run) must refuse without
      # DEV_DATABASE_URL rather than fall back to production; `db:push:prod` (the
      # deploy build's) must still use APP_DATABASE_URL.
      - name: Workspace pushes never reach production
        env:
          APP_DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/prod
        run: |
          set +e
          out=$(npm run db:push 2>&1); code=$?
          echo "$out" | tail -5
          if [ $code -eq 0 ] || ! echo "$out" | grep -q "refusing to fall back to production"; then
            echo "::error::npm run db:push without DEV_DATABASE_URL did not refuse."
            exit 1
          fi
          out=$(DEV_DATABASE_URL=postgresql://ci:ci@127.0.0.1:1/dev npm run db:push 2>&1)
          echo "$out" | grep "database:"
          echo "$out" | grep -q "127.0.0.1/dev (from DEV_DATABASE_URL, target dev)" || { echo "::error::db:push did not use DEV_DATABASE_URL."; exit 1; }
          out=$(DEV_DATABASE_URL=postgresql://ci:ci@127.0.0.1:1/dev npm run db:push:prod 2>&1)
          echo "$out" | grep "database:"
          echo "$out" | grep -q "127.0.0.1/prod (from APP_DATABASE_URL, target default)" || { echo "::error::db:push:prod did not use APP_DATABASE_URL."; exit 1; }

  mobile:
    name: Mobile app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
