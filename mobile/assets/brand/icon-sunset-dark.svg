<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- "Sunset", dark variant (iOS dark appearance). The Zap bolt (the six points of
       components/SplitActionButton.tsx) scaled 0.8 about the centre, with a warm
       gradient running corner to corner across the bolt's own bounding box.
       Square, opaque, no rounding: iOS and Android apply their own masks.
       PNGs are rendered from this by scripts/render-brand-icons.mjs. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2B30"/><stop offset="1" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC14D"/><stop offset="0.5" stop-color="#F26A2A"/><stop offset="1" stop-color="#E0361E"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <polygon points="568.8,102.4 314.4,582.4 512,582.4 455.2,921.6 709.6,441.6 512,441.6" fill="url(#bolt)"/>
</svg>
