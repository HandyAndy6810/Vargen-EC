<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- "Sunset", tinted variant (iOS tinted appearance): the same bolt in one
       light grey on a dark grey ramp. iOS applies the user's tint over it. -->
