      <stop offset="0" stop-color="#3A3A3E"/><stop offset="1" stop-color="#2A2A2E"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <polygon points="568.8,102.4 314.4,582.4 512,582.4 455.2,921.6 709.6,441.6 512,441.6" fill="#D9D9DC"/>
</svg>
